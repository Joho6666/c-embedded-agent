name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer1-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  layer1-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Layer 1 gates (docs drift, secret scan)
        run: |
          python scripts/check_docs_drift.py
          python scripts/secret_scan.py
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  layer2-toolchain:
    runs-on: ubuntu-latest
    needs: [layer1-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - run: pip install -r backend/requirements.txt
      - name: Build all golden projects
        run: |
          set -e
          ls -d examples/golden/stm32f103_* | xargs -P 4 -I{} sh -c 'cd "$1" && make -j4' _ {}
      - name: Benchmark smoke (honest skip without LLM)
        run: |
          python benchmarks/benchmark.py
          python -c "import json;d=json.load(open('benchmarks/stm32f103/latest-summary.json'));assert d.get('skipped') or d.get('llm'), 'no fake scores allowed'"

  layer3-simulation:
    runs-on: ubuntu-latest
    # Independent of layer2: builds its own spike ELF, so it can run in parallel
    # instead of waiting behind the golden builds.
    needs: [layer1-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - run: pip install -r backend/requirements.txt
      - name: Install Renode (pinned)
        run: |
          curl -sL -o /tmp/renode.tar.gz https://github.com/renode/renode/releases/download/v1.15.3/renode-1.15.3.linux-portable.tar.gz
          mkdir -p "$HOME/tools" && tar -xzf /tmp/renode.tar.gz -C "$HOME/tools"
          echo "CEA_RENODE_PATH=$HOME/tools/renode_1.15.3/renode" >> "$GITHUB_ENV"
      - name: Build simulation spike ELF
        run: |
          cd backend/tests/fixtures/renode_spike
          arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -T f103.ld -nostdlib -O1 sim_uart.c -o sim_uart.elf
      - name: Run simulation tests (real Renode)
        run: python -m pytest tests/test_simulation.py -q
        working-directory: backend

  # Layer 4: hardware runs ONLY on a self-hosted hardware-lab runner,
  # only when manually dispatched — never on every commit, never on cloud runners.
  layer4-hardware:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hardware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Hardware discovery (honest probe)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, 'backend')
          from app.hardware.discovery import discover, save_report
          from app.hardware.devices import refresh_from_discovery
          r = discover(); save_report(r); refresh_from_discovery(r)
          print({p['id']: p['presence'] for p in r['probes']})
          EOF
      - name: Hardware pipeline (requires probe; else honest UNAVAILABLE)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, 'backend')
          from app.core import build_project
          print('build:', build_project.__name__, 'available')
          # Full flash/serial/validate requires the lab fixture:
          # docs/hardware-lab/stm32f103-bluepill.md
          EOF
