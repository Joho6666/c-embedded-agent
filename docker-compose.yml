services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/gateway.db
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY}
      GATEWAY_PUBLIC_URL: http://localhost:8000/v1
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOW_LOCAL_UPSTREAM: ${ALLOW_LOCAL_UPSTREAM:-false}
      REDIS_URL: ${REDIS_URL:-}
      APP_ENV: ${APP_ENV:-development}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 8

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_PUBLIC_URL: http://localhost:8000/v1
    ports:
      - "3000:3000"
    environment:
      GATEWAY_BACKEND_URL: http://backend:8000
      GATEWAY_ADMIN_API_KEY: ${GATEWAY_ADMIN_API_KEY}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

volumes:
  gateway-data:
